<!DOCTYPE html>
<html lang="pt-br"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <title> Sakura </title>

</head>
<body>

<header>
    <img src="./img/05d8c361-9990-43e2-b208-12d4d529a863.png" alt="Sakura" class="sakura">
    <h3>O melhor dos Pimentas</h3>
    <ul>

        <input type="text" placeholder="O que deseja procurar?">
        <li>legado</li>
        <li>trabalho</li>
        <li>contato</li>
      
    </ul>
</header>
<h1>Sakura</h1>
   <img src="./img/04696267-a2f2-432f-8b6f-e9498116c995.png" class="banner">

<section class="pedidos">

    <div class="produto">
        <img src="./img/Sushi.png" alt="Sushi">
        <h2>Sushi</h2>
        <p>Sushi tradicional japonês</p>
        <strong>R$ 25,00</strong>
        <button>Fazer pedido</button>
    </div>

    <div class="produto">
        <img src="./img/Temaki.png" alt="Temaki">
        <h2>Temaki</h2>
        <p>Temaki de salmão</p>

    <div class="produto">
        <img src="./img/Ramen.png" alt="Ramen">
